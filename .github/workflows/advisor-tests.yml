name: Advisor Data Checks

on:
  pull_request:
    paths:
      - "data/**"
      - "app.js"
      - "addon-advisor.js"
      - "index.html"
      - "styles.css"
      - "sw.js"
      - "version.js"
      - "tests/**"
      - "tools/patch_tracker.py"
      - ".github/workflows/advisor-tests.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "app.js"
      - "addon-advisor.js"
      - "index.html"
      - "styles.css"
      - "sw.js"
      - "version.js"
      - "tests/**"
      - "tools/patch_tracker.py"
      - ".github/workflows/advisor-tests.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probar datos y Patch Tracker con Python
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validar asignaciones de iconos de WoW
        run: node tests/icon-map.test.js
      - name: Comprobar sintaxis de JavaScript
        run: |
          node --check app.js
          node --check race-v43-content.js
          node --check tests/race-advisor.test.js
          node --check tests/race-redesign-browser.cjs
          node --check tests/skyborne-browser.cjs
          node --check addon-advisor.js
          node tests/addon-advisor.test.js
          node --check icons/icon-map.js
          node --check sw.js
          node --check version.js
          node --check tests/talent-advisor.test.js
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Probar 81 fichas, navegación y modo offline
        run: node tests/browser-smoke.cjs
